services:
  postgres:
    image: postgres:16-alpine
    container_name: apostas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apostas}
      POSTGRES_USER: ${POSTGRES_USER:-apostas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apostas}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apostas} -d ${POSTGRES_DB:-apostas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dados:
