spring:
  application:
    name: calculadora-apostas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apostas}
    username: ${DB_USER:apostas}
    password: ${DB_PASSWORD:apostas}

  jpa:
    # O schema pertence ao Flyway. O Hibernate apenas confere se o mapeamento bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      # Folga acima de apostas.ia.limite-imagem-mb para que a mensagem de erro venha
      # da validacao do dominio, que explica o motivo, e nao do container.
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

apostas:
  fontes:
    # Consumidas a partir da Fase 2. Valor vazio por padrao: sem variavel de
    # ambiente definida, a ingestao fica desligada em vez de usar chave embutida.
    api-football:
      chave: ${API_FOOTBALL_KEY:}
    odds-api:
      chave: ${ODDS_API_KEY:}

  ia:
    # Leitura de bilhete por imagem. Sem ANTHROPIC_API_KEY a aplicacao sobe normalmente
    # e o endpoint responde 503 explicando o que falta.
    chave: ${ANTHROPIC_API_KEY:}
    modelo: claude-opus-5
    esforco: high
    max-tokens: 16000
    limite-imagem-mb: 5
